server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          # 끔. 켜면 Eureka에 등록된 모든 서비스가 /서비스이름/** 로 자동 노출되어
          # 아래 명시적 라우팅을 우회하는 경로가 생긴다.
          enabled: false
      routes:
        # 서비스를 분리할 때마다 아래처럼 명시적 라우팅을 추가한다.
        # lb://는 Eureka에서 그 이름의 서비스를 찾아 로드밸런싱한다는 뜻.
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        #
        # - id: statistics-service          # 2단계
        #   uri: lb://STATISTICS-SERVICE
        #   predicates:
        #     - Path=/api/statistics/**
        #
        # - id: notice-service              # 3단계
        #   uri: lb://NOTICE-SERVICE
        #   predicates:
        #     - Path=/api/notice/**,/api/disposal-items/**
        #
        # - id: inventory-service           # 4단계
        #   uri: lb://INVENTORY-SERVICE
        #   predicates:
        #     - Path=/api/foodmaterials/**
        #
        # - id: sales-service               # 4단계
        #   uri: lb://SALES-SERVICE
        #   predicates:
        #     - Path=/api/menus/**,/api/sales/**

eureka:
  client:
    service-url:
      # 로컬에서는 localhost, 도커/AWS에서는 환경변수로 덮어쓴다.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        # 게이트웨이에 실제로 등록된 라우팅을 확인하는 용도
        include: health,gateway

jwt:
  secret: ${JWT_SECRET}
