server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Eureka에 등록된 서비스 이름으로 자동 라우팅을 켠다.
          # 예: http://localhost:9000/auth-service/** -> AUTH 서비스로
          enabled: true
          lower-case-service-id: true
      routes:
        # 서비스를 분리할 때마다 아래처럼 명시적 라우팅을 추가한다.
        # lb://는 Eureka에서 그 이름의 서비스를 찾아 로드밸런싱한다는 뜻.
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        #
        # - id: inventory-service
        #   uri: lb://INVENTORY-SERVICE
        #   predicates:
        #     - Path=/api/foodmaterials/**
        #
        # - id: sales-service
        #   uri: lb://SALES-SERVICE
        #   predicates:
        #     - Path=/api/menus/**, /api/sales/**

eureka:
  client:
    service-url:
      # 로컬에서는 localhost, 도커/AWS에서는 환경변수로 덮어쓴다.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        # 게이트웨이에 실제로 등록된 라우팅을 확인하는 용도
        include: health,gateway

jwt:
  secret: ${JWT_SECRET}
